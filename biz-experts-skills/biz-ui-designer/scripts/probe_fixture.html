<!doctype html>
<meta charset="utf-8">
<meta name="build" content="fixture-v1">
<title>ui_probe negative control</title>
<style>
  /* 문서는 스크롤하지 않고 내부 상자가 스크롤한다 — scrollTruth 가 잡아야 한다 */
  html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; }
  .shell { height: 100%; overflow-y: auto; padding: 0; }
  .page { }

  /* ① 글리프 vs 박스 — min-height 안에서 글자가 중앙 정렬돼 박스만 커진다 */
  .credit { min-height: 48px; display: flex; align-items: center; font-size: 12px; }
  .after-credit { font-size: 14px; }

  /* ② gradient 배경 위 텍스트 — 대비를 "계산"하면 안 되고 unmeasurable 이어야 한다 */
  .grad { background: linear-gradient(90deg, #fff, #eee); color: #d8d8d8; padding: 8px; }

  /* ③ 단색 배경 위 진짜 대비 미달 */
  .lowcontrast { background: #ffffff; color: #d0d0d0; font-size: 14px; }

  /* ④ 스케일 이탈 — 7px, 13px 는 스케일 밖 */
  .odd { padding: 7px; gap: 13px; display: flex; }

  /* ⑤ 잘림 */
  .clip { height: 20px; overflow: hidden; }

  /* ⑥ 작은 터치 타깃 */
  .tiny { display: inline-block; width: 16px; height: 16px; }

  /* ⑦ 깨끗한 대조군 — 아무 지적도 나오면 안 된다 */
  .clean { padding: 16px; font-size: 16px; color: #111111; background: #ffffff; word-break: keep-all; }
</style>

<div class="shell">
  <div class="page">
    <p class="credit">사진 출처 표기</p>
    <p class="after-credit">바로 아래 문단</p>

    <p class="grad">그라디언트 배경 위의 흐린 글자</p>
    <p class="lowcontrast">단색 배경 위 대비 미달 문장</p>

    <div class="odd"><span>가</span><span>나</span></div>

    <div class="clip"><p>이 문단은 20px 상자 안에서 잘린다. 두 줄 이상이 되도록 충분히 긴 문장을 넣는다.</p></div>

    <a class="tiny" href="#">·</a>

    <!-- 한글인데 keep-all 이 없다 -->
    <p style="font-size:14px">한글 문장은 keep-all 이 없으면 어절 중간에서 깨진다</p>

    <!-- 한글 큰 제목에 행간 1.0 미만 -->
    <h1 style="font-size:32px; line-height:0.9">받침이 겹치는 큰 제목</h1>

    <!-- 미로드 이미지 → blindSpots -->
    <img src="does-not-exist.png" alt="">

    <p class="clean">대조군 문단입니다. 여기서는 지적이 나오면 안 됩니다.</p>

    <!-- 문서를 넘치게 해서 .shell 이 실제로 스크롤하게 만든다 -->
    <div style="height:1400px"></div>
  </div>
</div>
